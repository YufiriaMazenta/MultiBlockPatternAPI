simple_altar:
  display_name: "简易祭坛"
  rotation: true

  layer:
    - "L L"
    - " B "
    - "L L"

  blocks:
    L: minecraft:oak_log
    B: minecraft:beacon

  actions:
    - type: destroy_structure
      drop_items: true
    - type: script
      script:
        - 'tell("&6祭坛激活!")'
        - 'summon("minecraft:wither")'

iron_golem:
  display_name: "铁傀儡"
  rotation: false

  layer:
    - " P "
    - "IBI"
    - " I "

  blocks:
    I: minecraft:iron_block
    B: minecraft:carved_pumpkin
    P: minecraft:jack_o_lantern

  trigger: P

  actions:
    - type: destroy_structure
      drop_items: false

wither:
  display_name: "凋零"
  rotation: false

  layer:
    - "S S"
    - "SBS"
    - " B "
    - " B "

  blocks:
    B: minecraft:soul_sand
    S: minecraft:wither_skeleton_skull

  trigger: S

  actions:
    - type: destroy_structure
      drop_items: false

nether_portal:
  display_name: "下界传送门"
  rotation: true
  direction: vertical

  layer:
    - "OOOOO"
    - "O___O"
    - "O___O"
    - "O___O"
    - "OOOOO"

  blocks:
    O: minecraft:obsidian
    _: minecraft:air

  actions:
    - type: destroy_structure
      drop_items: true

treasure_room:
  display_name: "宝藏房间"
  rotation: false

  layers:
    -  # Layer 0
      - "SSSSS"
      - "S___S"
      - "S___S"
      - "S___S"
      - "SSSSS"
    -  # Layer 1
      - "S___S"
      - "_____"
      - "_____"
      - "_____"
      - "S___S"
    -  # Layer 2
      - "SSSSS"
      - "S___S"
      - "S_C_S"
      - "S___S"
      - "SSSSS"

  blocks:
    S: minecraft:stone_bricks
    _: minecraft:air
    C: minecraft:chest

